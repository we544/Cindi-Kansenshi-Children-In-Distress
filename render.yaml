services:
  - type: web
    name: cindi-kansenshi-website
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/admin/status
    autoDeployTrigger: commit
    envVars:
      - key: CINDI_ENV
        value: production
      - key: CINDI_DATA_DIR
        value: /tmp/cindi-data
      - key: CINDI_COOKIE_SECURE
        value: "1"
      - key: CINDI_SECRET_KEY
        generateValue: true
      - key: CINDI_SETUP_TOKEN
        sync: false
